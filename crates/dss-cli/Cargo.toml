[package]
name = "dss-cli"
version = "0.1.0"
edition = "2024"

# Stage F lane split (DE_PASCALIZE Part IV.2): the binary's build option for
# the bit-compat engine — `cargo build -p dss-cli --features oracle-parity`
# produces the parity-lane CLI, the default build the idiomatic one.
[features]
oracle-parity = ["dss-core/oracle-parity"]

[dependencies]
dss-core = { path = "../dss-core" }
# P5c: the binary owns diagnostic presentation. `fancy-no-backtrace` is the
# graphical (miette) render handler — enabled ONLY here, never in the library
# crates (which stay protocol-only). `--diag=pretty` renders through it.
miette = { workspace = true, features = ["fancy-no-backtrace"] }

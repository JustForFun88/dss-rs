[package]
name = "dss-cli"
version = "0.1.0"
edition = "2024"
license.workspace = true

# `cargo build -p dss-cli -p dss-compat --features dss-compat/opendss-parity`
# builds the parity-lane CLI (cargo takes a feature only of a selected package or
# a direct dependency), the default build the product one.
[dependencies]
dss-core = { path = "../dss-core" }
# The binary owns diagnostic presentation. `fancy-no-backtrace` is the
# graphical (miette) render handler — enabled ONLY here, never in the library
# crates (which stay protocol-only). `--diag=pretty` renders through it.
miette = { workspace = true, features = ["fancy-no-backtrace"] }

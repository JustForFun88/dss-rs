[package]
name = "dss-core"
version = "0.1.0"
edition = "2024"

# Stage F lane split (DE_PASCALIZE Part IV.2). `oracle-parity` is **additive**:
# it selects the bit-compat kernels (`src/compat.rs`) that keep every existing
# oracle gate — byte goldens, checkpoint Y, corpus floors, iteration counts —
# green forever. The default build is the idiomatic-Rust product lane. Enabling
# it here propagates to the two other crates that carry compat kernels, so
# `cargo test --workspace --features dss-core/oracle-parity` builds one
# consistent parity workspace.
[features]
oracle-parity = ["dss-parser/oracle-parity", "dss-sparse/oracle-parity"]

[dependencies]
dss-metis = { path = "../dss-metis" }
dss-parser = { path = "../dss-parser" }
dss-sparse = { path = "../dss-sparse" }
# WASM user-model host (WASM_USERMODELS_PLAN §2.1): the sandboxed wasmi
# replacement for the upstream user-written-DLL loader. Consumed by the
# Generator (WM.3) / Storage / PVSystem / CapControl (WM.4/WM.5) call sites.
dss-usermodel = { path = "../dss-usermodel" }
comfy-table.workspace = true
miette.workspace = true
num-complex.workspace = true
regex.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uuid.workspace = true

[dev-dependencies]
serde.workspace = true
# P5b diagnostic-render snapshots: the graphical (miette `fancy`) handler is a
# TEST-ONLY dependency — the shipped library stays protocol-only (the release
# build compiles no dev-deps), matching the nushell layering. `dss-cli` (P5c)
# enables it as a real dependency for the binary.
miette = { workspace = true, features = ["fancy-no-backtrace"] }
# MULTITHREADING_PLAN M1 benchmark baseline (also the measured proof for
# DE_PASCALIZE P15 dss-sparse allocation hygiene). `default-features = false`
# drops the html/plotters report stack — only the timing core is needed.
criterion = { version = "0.5", default-features = false }
dss-sparse = { path = "../dss-sparse" }
num-complex.workspace = true
# Content digests for the golden provenance lock (GOLDEN_REBASE_PLAN.md §1.2,
# `tests/golden_lock.rs`). Pure Rust, already in the workspace lock file via
# `dss-usermodel`'s fixture-hash scaffold — same version, no new closure.
sha2 = "0.10"

# GOLDEN_REBASE G1.3a — `tests/capture_order.rs` resolves each
# `capture-order: <Name> (<A|B|C>)` marker's D3 group through
# `dss_epri::modes::capture_group_of`, so the capture bodies and the gate that
# checks them share the ONE mode table instead of growing a second, competing
# order table (spec amendment item 1). Test-only, Windows-only: `dss-epri` is
# `#[cfg(windows)]` (the vendored EPRI binary is a Win64 DLL) and
# `publish = false`, so nothing here reaches the shipped engine.
[target.'cfg(windows)'.dev-dependencies]
dss-epri = { path = "../dss-epri" }

[[bench]]
name = "snapshot_8500"
harness = false

[[bench]]
name = "ybuild_8500"
harness = false

[[bench]]
name = "lu_factor_solve"
harness = false

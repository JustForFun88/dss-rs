[package]
name = "dss-test-harness"
version = "0.0.0"
edition = "2024"
publish = false
description = "Test-only: the golden/oracle comparison harness of the dss-core integration tests"

# The golden/oracle comparison harness of `crates/dss-core/tests/*.rs`: one
# library, a dev-dependency of dss-core, compiled once per lane, whose
# self-tests run once per lane, in its own lib test binary. No `[features]`:
# the lane is dss-core's, read through `dss_core::compat::ORACLE_PARITY`
# (`harness/lane.rs`), and cargo builds ONE dss-core for the drivers and this
# crate, so both see the same lane.
[dependencies]
dss-core = { path = "../dss-core" }
dss-epri = { path = "../dss-epri" }
num-complex.workspace = true
serde.workspace = true
serde_json.workspace = true

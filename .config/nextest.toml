# cargo-nextest: the gate's test runner.
#
# Pinned runner: cargo-nextest 0.9.146. Install either
#   cargo install cargo-nextest --version 0.9.146 --locked
# or the prebuilt https://get.nexte.st/0.9.146/windows (the same zip as the
# GitHub release asset cargo-nextest-0.9.146-x86_64-pc-windows-msvc.zip,
# SHA-256 0FA689815C8157E4633225B6B173184B3D546EB6FFB754C3D0E6EA5973284A20)
# unpacked into ~/.cargo/bin. `nextest-version` below refuses an older one.
#
# nextest runs every test in its own process and does not run doctests: the
# gate adds `cargo test --workspace --doc` per lane for those.
#
# No test groups and no serialization: no test writes under tests/corpus/
# (every writer and every corpus-gate producer runs a scratch copy,
# harness/scratch.rs, and the corpus gate fails on a change of the vendored
# tree during its own walk, scheduler::GateRun::assert_complete). A test that
# needs a group is a writer to fix, never a group to add here. No default-filter
# and no setup scripts either: every test of the workspace runs, with the
# environment the gate gives it.
#
# Nothing else either: the four settings below, one line each, are the whole
# profile (no override, no run-extra-args, no JUnit table).

nextest-version = { required = "0.9.146" }

[profile.default]
# A failure is a failure: never retried into green.
retries = 0
# Run every test: one red never hides the rest of the lane.
fail-fast = false
# Report a test still running after each 600 s period and terminate it after
# the third (1800 s): a wedged test fails instead of holding the machine. The
# corpus gate, the slowest test, finishes inside two periods.
slow-timeout = { period = "600s", terminate-after = 3 }

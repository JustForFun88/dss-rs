name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # Windows-only since UNIFIED_GATE Phase C/D: the mandatory corpus gate
        # drives the EPRI r4133 OpenDSSDirect.dll via `epri-worker` (the
        # #[cfg(windows)] dss-epri bridge crate), so the gate's test run
        # cannot pass on Linux (epri-worker exits 1 on non-Windows by design).
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.4"
      # The test steps run the live oracle gate unconditionally (corpus_gate.rs
      # no longer reads DSS_LIVE_ORACLE), so the pinned dss-python oracle must be
      # present for them. Versions MUST match tools/golden/PIN.txt exactly.
      - name: Install pinned oracle (tools/golden/PIN.txt)
        run: pip install "dss-python==0.15.7" "dss-python-backend==0.14.5"
      # The gate's test runner, pinned to the version `.config/nextest.toml`
      # requires (RETRO_FIXES RF-I00-01). The `@nextest` shorthand of this
      # action installs only the latest release, so the pin goes through `tool:`.
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest@0.9.146
      # The mandatory gate is seven commands over BOTH Stage F lanes (CLAUDE.md
      # "## Gate", TESTING.md §"The mandatory gate"): nextest runs every test in
      # its own process and no doctest, hence the two `--doc` steps. The parity
      # lane is not a variant to spot
      # check: it is the lane that carries the byte goldens and the exact
      # iteration pins against the oracle, and it is the compensating control
      # for every band the default lane is allowed. Running only the default
      # lane here would leave both of those unchecked on every PR.
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy (default lane)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Clippy (parity lane)
        run: cargo clippy --workspace --all-targets --features dss-core/oracle-parity -- -D warnings
      - name: Test (default lane)
        env:
          DSS_ORACLE_TIMEOUT_SECS: "600"
        run: cargo nextest run --workspace
      - name: Test (parity lane)
        env:
          DSS_ORACLE_TIMEOUT_SECS: "600"
        run: cargo nextest run --workspace --features dss-core/oracle-parity
      - name: Doctests (default lane)
        run: cargo test --workspace --doc
      - name: Doctests (parity lane)
        run: cargo test --workspace --doc --features dss-core/oracle-parity

name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace

  # Live oracle gate: compiles+solves every `solvable_now` corpus case on the Rust
  # engine AND the pinned dss-python oracle and compares the full model live (the
  # `DSS_LIVE_ORACLE=1` path of corpus_live.rs). It needs Python + the pinned
  # oracle, which the main `test` job/most contributors lack — hence its own job
  # (PHASE6_PLAN / CORPUS_TEST_PLAN: "a dedicated pinned-oracle CI job"). Versions
  # MUST match tools/golden/PIN.txt exactly.
  live-oracle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.4"
      - name: Install pinned oracle (tools/golden/PIN.txt)
        run: pip install "dss-python==0.15.7" "dss-python-backend==0.14.5"
      - name: Live oracle comparison
        # Run the whole corpus_live binary (not a single -name filter): a name
        # filter that matches nothing exits 0, so a renamed test would silently
        # green this job. corpus_live_classify self-skips without DSS_LIVE_CLASSIFY
        # and solvable_now_has_multistep_depth needs no oracle.
        env:
          DSS_LIVE_ORACLE: "1"
          DSS_ORACLE_TIMEOUT_SECS: "600"
        run: cargo test -p dss-core --test corpus_live -- --nocapture --test-threads=1

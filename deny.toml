# cargo-deny config: `cargo deny check licenses`. The policy is the licence
# allowlist in CLAUDE.md. Nothing copyleft is linked or bundled.

[graph]
all-features = true

[licenses]
# Crates with `publish = false` are not distributed and are not checked.
private = { ignore = true }
# The list is the policy, not an inventory: an unused identifier is no warning.
unused-allowed-license = "allow"
# A dual-licensed crate passes through its permissive option.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "BSL-1.0",
    "Unicode-3.0",
    "CC0-1.0",
    "CC-BY-4.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"

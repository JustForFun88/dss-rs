[workspace]
resolver = "3"
members = ["crates/dss-cli", "crates/dss-core", "crates/dss-epri", "crates/dss-metis", "crates/dss-parser", "crates/dss-sparse", "crates/dss-usermodel"]

[workspace.dependencies]
num-complex = "0.4"
regex = "1"
thiserror = "2"
# Diagnostics protocol (DE_PASCALIZE P5). Protocol only — the `fancy`
# terminal-render handler is pulled in by `dss-cli` alone (P5c), the library
# crates carry structured `Diagnostic` data with default features off.
miette = { version = "7", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Test-only: the `dss-epri` bridge crate loads the official EPRI OpenDSSDirect.dll
# (the r4133 live-oracle channel) via `libloading`. Product crates never depend on
# this — `dss-epri` is `publish = false` and the sole `#![forbid(unsafe_code)]`
# carve-out (UNIFIED_GATE_PLAN.md §2, Phase A).
libloading = "0.8"
# UUID v4 generation for the CIM UUID plumbing (Pascal `NamedObject.CreateUUID4`,
# PHASE8_PLAN WP8.6 step 6). Random v4s are never oracle-pinnable; the goldens
# preload every UUID via the `Uuids` command.
uuid = { version = "1", features = ["v4"] }
# WASM user-model host interpreter (WASM_USERMODELS_PLAN §2.1): pure-Rust wasmi,
# pinned exactly per tools/wasm_usermodel/PIN.txt (the typst-verified release —
# .inputs/typst/Cargo.toml). `default-features = false` + "simd" is the typst
# feature set; the dependency closure is pure Rust (no C, no JIT — probe P4).
wasmi = { version = "=1.0.9", default-features = false, features = ["simd"] }

# Runtime speed for the mandatory gate: `cargo test` (dev/test profile) runs
# the live corpus — including yearly/8500-node/`large` decks — through the
# engine, and at opt-level 0 a single yearly EPRI-feeder deck costs ~14 min
# (~×10 vs optimized). Optimize the engine crates and all dependencies
# (notably faer's sparse LU) while the test binaries themselves stay at opt 0
# for fast incremental builds. Rust float semantics do not change with opt
# level (no fast-math/reassociation), and the live gate's exact-iteration-count
# contract across the whole corpus pins that empirically.
#
# Safety knobs are ORTHOGONAL to opt-level and pinned explicitly so a future
# profile edit cannot silently drop them: slice bounds checks are never
# removed at any opt-level (the Monitor mode-7 OOB panic was caught by a
# --release build), and `overflow-checks`/`debug-assertions` keep their dev
# defaults — this is exactly why the per-package dev override is used instead
# of running the gate under `--release` (which would set overflow-checks=false).
[profile.dev.package."*"] # dependencies only; workspace members listed below
opt-level = 3

[profile.dev.package.dss-core]
opt-level = 3
overflow-checks = true
debug-assertions = true

[profile.dev.package.dss-sparse]
opt-level = 3
overflow-checks = true
debug-assertions = true

[profile.dev.package.dss-parser]
opt-level = 3
overflow-checks = true
debug-assertions = true

# The WASM user-model host: the wasmi interpreter executes guest models inside
# the gate's tests (and, from WM.3, inside golden/corpus runs) — keep it
# optimized like the engine crates. Safety knobs kept at dev defaults.
[profile.dev.package.dss-usermodel]
opt-level = 3
overflow-checks = true
debug-assertions = true

# The test-only EPRI bridge (UNIFIED_GATE_PLAN.md §7 Data/config): optimize it
# with the engine crates so the `epri-worker` marshalling / ByteStream decode is
# not opt-0 slow on the corpus sweep. Safety knobs kept at dev defaults.
[profile.dev.package.dss-epri]
opt-level = 3
overflow-checks = true
debug-assertions = true
